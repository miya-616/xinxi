<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射击游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 8px;
            color: #4fc3f7;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.7);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #bbbbbb;
            margin-bottom: 25px;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }
        
        #gameCanvas {
            background-color: #111;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
            display: block;
            width: 100%;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            background-color: rgba(0, 30, 60, 0.7);
            border-radius: 10px;
            padding: 15px 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4fc3f7;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
        }
        
        button {
            background: linear-gradient(145deg, #1a5f7a, #0d3a52);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            min-width: 140px;
        }
        
        button:hover {
            background: linear-gradient(145deg, #0d3a52, #1a5f7a);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #startBtn {
            background: linear-gradient(145deg, #2e7d32, #1b5e20);
        }
        
        #restartBtn {
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
        }
        
        .instructions {
            background-color: rgba(0, 30, 60, 0.7);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        .instructions h3 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        
        .instructions p {
            margin-bottom: 10px;
            line-height: 1.5;
            color: #ccc;
        }
        
        .key {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-family: monospace;
            margin: 0 5px;
            border: 1px solid #555;
        }
        
        .mobile-controls {
            display: none;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .mobile-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: rgba(79, 195, 247, 0.2);
            border: 2px solid #4fc3f7;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            border: 2px solid #ff5252;
            width: 80%;
            max-width: 500px;
        }
        
        .game-over h2 {
            color: #ff5252;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .game-info {
                flex-direction: column;
                gap: 15px;
            }
            
            .mobile-controls {
                display: flex;
            }
            
            .instructions p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>太空射击游戏</h1>
        <div class="subtitle">驾驶飞船，消灭敌人，获取高分！</div>
    </header>
    
    <div class="game-info">
        <div class="info-item">
            <div class="info-label">得分</div>
            <div id="score" class="info-value">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">生命值</div>
            <div id="lives" class="info-value">3</div>
        </div>
        <div class="info-item">
            <div class="info-label">等级</div>
            <div id="level" class="info-value">1</div>
        </div>
        <div class="info-item">
            <div class="info-label">敌人剩余</div>
            <div id="enemies" class="info-value">10</div>
        </div>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="gameOver" class="game-over">
            <h2>游戏结束</h2>
            <p>你的得分: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>
    
    <div class="controls">
        <button id="startBtn">开始游戏</button>
        <button id="pauseBtn">暂停游戏</button>
        <button id="instructionsBtn">游戏说明</button>
    </div>
    
    <div class="mobile-controls">
        <div class="mobile-btn" id="leftBtn">←</div>
        <div class="mobile-btn" id="shootBtn">射击</div>
        <div class="mobile-btn" id="rightBtn">→</div>
    </div>
    
    <div class="instructions" id="instructionsPanel">
        <h3>游戏说明</h3>
        <p><span class="key">←</span> <span class="key">→</span> 或 <span class="key">A</span> <span class="key">D</span> 键控制飞船左右移动</p>
        <p><span class="key">空格键</span> 或 <span class="key">点击射击按钮</span> 发射子弹</p>
        <p>躲避敌人的攻击，射击敌人获得分数</p>
        <p>每消灭10个敌人进入下一关，敌人速度会变快</p>
        <p>生命值降为0时游戏结束，尽可能获得高分！</p>
    </div>
    
    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态
        let game = {
            running: false,
            paused: false,
            score: 0,
            lives: 3,
            level: 1,
            enemiesRemaining: 10,
            enemiesDestroyed: 0
        };
        
        // 玩家飞船
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 60,
            speed: 8,
            color: '#4fc3f7',
            isShooting: false
        };
        
        // 子弹数组
        let bullets = [];
        
        // 敌人数组
        let enemies = [];
        
        // 粒子效果数组（用于爆炸效果）
        let particles = [];
        
        // 按键状态
        const keys = {};
        
        // 初始化游戏
        function initGame() {
            game.score = 0;
            game.lives = 3;
            game.level = 1;
            game.enemiesDestroyed = 0;
            game.enemiesRemaining = 10;
            
            bullets = [];
            enemies = [];
            particles = [];
            
            player.x = canvas.width / 2 - 25;
            player.y = canvas.height - 80;
            
            // 创建初始敌人
            createEnemies();
            
            // 更新显示
            updateDisplay();
            
            // 隐藏游戏结束画面
            document.getElementById('gameOver').style.display = 'none';
        }
        
        // 创建敌人
        function createEnemies() {
            enemies = [];
            const enemyRows = Math.min(game.level + 1, 4);
            const enemyCols = 5;
            const enemyWidth = 40;
            const enemyHeight = 40;
            const horizontalSpacing = 20;
            const verticalSpacing = 30;
            
            // 计算起始位置以使敌人居中
            const totalWidth = enemyCols * enemyWidth + (enemyCols - 1) * horizontalSpacing;
            const startX = (canvas.width - totalWidth) / 2;
            const startY = 50;
            
            for (let row = 0; row < enemyRows; row++) {
                for (let col = 0; col < enemyCols; col++) {
                    enemies.push({
                        x: startX + col * (enemyWidth + horizontalSpacing),
                        y: startY + row * (enemyHeight + verticalSpacing),
                        width: enemyWidth,
                        height: enemyHeight,
                        speed: 1 + game.level * 0.3,
                        direction: 1,
                        color: row % 2 === 0 ? '#ff5252' : '#ff9800'
                    });
                }
            }
            
            game.enemiesRemaining = enemies.length;
        }
        
        // 绘制玩家飞船
        function drawPlayer() {
            // 飞船主体
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            
            // 飞船装饰
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + player.width / 2 - 5, player.y + 10, 10, 15);
            
            // 飞船推进器效果
            if (game.running) {
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.ellipse(
                    player.x + player.width / 2, 
                    player.y + player.height + 5, 
                    8, 15, 0, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }
        
        // 绘制子弹
        function drawBullets() {
            for (let bullet of bullets) {
                ctx.fillStyle = bullet.color;
                ctx.beginPath();
                ctx.ellipse(bullet.x, bullet.y, bullet.width / 2, bullet.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制敌人
        function drawEnemies() {
            for (let enemy of enemies) {
                // 敌人主体
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.ellipse(
                    enemy.x + enemy.width / 2, 
                    enemy.y + enemy.height / 2, 
                    enemy.width / 2, 
                    enemy.height / 2, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();
                
                // 敌人眼睛
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(
                    enemy.x + enemy.width / 3, 
                    enemy.y + enemy.height / 3, 
                    3, 3, 0, 0, Math.PI * 2
                );
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(
                    enemy.x + enemy.width * 2 / 3, 
                    enemy.y + enemy.height / 3, 
                    3, 3, 0, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }
        
        // 绘制粒子效果
        function drawParticles() {
            for (let particle of particles) {
                ctx.globalAlpha = particle.life / 100;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }
        
        // 更新玩家位置
        function updatePlayer() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += player.speed;
            }
            
            // 边界检查
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }
        
        // 发射子弹
        function shoot() {
            if (!game.running || game.paused) return;
            
            bullets.push({
                x: player.x + player.width / 2,
                y: player.y,
                width: 6,
                height: 15,
                speed: 10,
                color: '#4fc3f7'
            });
        }
        
        // 更新子弹
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                
                // 移除超出画布的子弹
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        // 更新敌人
        function updateEnemies() {
            let changeDirection = false;
            
            for (let enemy of enemies) {
                enemy.x += enemy.speed * enemy.direction;
                
                // 检查是否触及边界
                if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
                    changeDirection = true;
                }
            }
            
            // 如果触及边界，改变方向并向下移动
            if (changeDirection) {
                for (let enemy of enemies) {
                    enemy.direction *= -1;
                    enemy.y += 20;
                    
                    // 如果敌人到达底部，玩家失去一条生命
                    if (enemy.y + enemy.height >= canvas.height - 100) {
                        enemy.y = canvas.height - 100 - enemy.height;
                        loseLife();
                    }
                }
            }
        }
        
        // 更新粒子
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life--;
                
                // 移除生命结束的粒子
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // 检测碰撞
        function detectCollisions() {
            // 子弹与敌人碰撞
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (checkCollision(bullets[i], enemies[j])) {
                        // 创建爆炸效果
                        createExplosion(enemies[j].x + enemies[j].width / 2, enemies[j].y + enemies[j].height / 2, enemies[j].color);
                        
                        // 移除子弹和敌人
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        
                        // 更新分数
                        game.score += 100;
                        game.enemiesDestroyed++;
                        game.enemiesRemaining--;
                        
                        // 检查是否进入下一关
                        if (game.enemiesDestroyed % 10 === 0) {
                            game.level++;
                            createEnemies();
                        }
                        
                        break;
                    }
                }
            }
            
            // 敌人与玩家碰撞
            for (let enemy of enemies) {
                if (checkCollision(player, enemy)) {
                    // 创建爆炸效果
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                    
                    // 移除敌人
                    const index = enemies.indexOf(enemy);
                    enemies.splice(index, 1);
                    
                    // 玩家失去生命
                    loseLife();
                    game.enemiesRemaining--;
                    
                    break;
                }
            }
        }
        
        // 检查两个对象是否碰撞
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }
        
        // 创建爆炸效果
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 50
                });
            }
        }
        
        // 失去生命
        function loseLife() {
            game.lives--;
            
            if (game.lives <= 0) {
                gameOver();
            }
        }
        
        // 游戏结束
        function gameOver() {
            game.running = false;
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('lives').textContent = game.lives;
            document.getElementById('level').textContent = game.level;
            document.getElementById('enemies').textContent = game.enemiesRemaining;
        }
        
        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制星空背景
            drawStars();
            
            // 绘制游戏对象
            drawPlayer();
            drawBullets();
            drawEnemies();
            drawParticles();
        }
        
        // 绘制星空背景
        function drawStars() {
            // 静态星空背景
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 100; i++) {
                const x = (i * 17) % canvas.width;
                const y = (i * 23) % canvas.height;
                const size = (i % 3) + 1;
                ctx.fillRect(x, y, size, size);
            }
            
            // 移动的星星
            if (game.running && !game.paused) {
                ctx.fillStyle = 'rgba(79, 195, 247, 0.6)';
                const time = Date.now() / 1000;
                for (let i = 0; i < 20; i++) {
                    const x = (time * 50 + i * 50) % canvas.width;
                    const y = (i * 30 + time * 30) % canvas.height;
                    const size = (Math.sin(time * 2 + i) + 1) * 1.5;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // 游戏循环
        function gameLoop() {
            if (game.running && !game.paused) {
                updatePlayer();
                updateBullets();
                updateEnemies();
                updateParticles();
                detectCollisions();
                updateDisplay();
            }
            
            drawGame();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 事件监听
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && game.running && !game.paused) {
                shoot();
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 开始游戏按钮
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!game.running) {
                initGame();
                game.running = true;
                game.paused = false;
                document.getElementById('startBtn').textContent = '重新开始';
            } else {
                initGame();
                game.running = true;
                game.paused = false;
            }
        });
        
        // 暂停游戏按钮
        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (game.running) {
                game.paused = !game.paused;
                document.getElementById('pauseBtn').textContent = game.paused ? '继续游戏' : '暂停游戏';
            }
        });
        
        // 重新开始按钮
        document.getElementById('restartBtn').addEventListener('click', () => {
            initGame();
            game.running = true;
            game.paused = false;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('startBtn').textContent = '重新开始';
            document.getElementById('pauseBtn').textContent = '暂停游戏';
        });
        
        // 游戏说明按钮
        document.getElementById('instructionsBtn').addEventListener('click', () => {
            const instructionsPanel = document.getElementById('instructionsPanel');
            instructionsPanel.style.display = instructionsPanel.style.display === 'none' ? 'block' : 'none';
        });
        
        // 移动设备控制
        document.getElementById('leftBtn').addEventListener('touchstart', () => {
            keys['ArrowLeft'] = true;
        });
        
        document.getElementById('leftBtn').addEventListener('touchend', () => {
            keys['ArrowLeft'] = false;
        });
        
        document.getElementById('rightBtn').addEventListener('touchstart', () => {
            keys['ArrowRight'] = true;
        });
        
        document.getElementById('rightBtn').addEventListener('touchend', () => {
            keys['ArrowRight'] = false;
        });
        
        document.getElementById('shootBtn').addEventListener('touchstart', () => {
            if (game.running && !game.paused) {
                shoot();
            }
        });
        
        // 调整Canvas大小以适应屏幕
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            const containerWidth = container.clientWidth;
            
            canvas.width = Math.min(800, containerWidth);
            canvas.height = canvas.width * 0.625; // 保持800x500的比例
        }
        
        // 窗口大小改变时调整Canvas
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // 启动游戏循环
        gameLoop();
    </script>
</body>
</html>
